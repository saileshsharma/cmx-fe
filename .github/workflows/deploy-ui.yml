name: Deploy cmx-ui to S3 + CloudFront

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'         # match your local choice
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-1
          role-to-assume: arn:aws:iam::933051411734:oidc-provider/token.actions.githubusercontent.com   # or use AWS keys

      - name: Sync to S3 (assets)
        run: |
          aws s3 sync dist s3://cmx-ui-prod-9330-5141-1734-ap-southeast-1 \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "text/plain" || true  # types handled below
          # Fix content types
          find dist -type f -name "*.js" -exec aws s3 cp {} s3://cmx-ui-prod-9330-5141-1734-ap-southeast-1/{} --metadata-directive REPLACE --cache-control "public, max-age=31536000, immutable" --content-type "application/javascript" \;
          find dist -type f -name "*.css" -exec aws s3 cp {} s3://cmx-ui-prod-9330-5141-1734-ap-southeast-1/{} --metadata-directive REPLACE --cache-control "public, max-age=31536000, immutable" --content-type "text/css" \;

      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp dist/index.html s3://cmx-ui-prod-9330-5141-1734-ap-southeast-1/index.html \
            --cache-control "no-cache" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id <DISTRIBUTION_ID> --paths "/index.html" "/"
